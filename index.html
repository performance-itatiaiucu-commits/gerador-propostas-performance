<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Propostas — Performance Ocupacional</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1F386E">
<style>
:root{
  /* === PALETA DA MARCA — extraída do logotipo Grupo Performance === */
  --azul:#1F386E;        /* azul institucional (texto do logo) */
  --azul2:#2c4d8f;
  --ciano:#04CCFF;       /* círculo ciano */
  --roxo:#9A66CB;        /* círculo roxo */
  --verde:#7FCC0E;       /* círculo verde */
  --indigo:#6766CC;      /* sobreposição ciano+roxo */
  --claro:#eaf1fa; --claro2:#f4f8fd; --borda:#d3ddea;
  --txt:#1d2733; --mut:#64748b; --ok:#0f7a45; --alerta:#b45309; --erro:#b91c1c;
  --bg:#eef2f7;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--borda);border-radius:6px;background:#fff;color:var(--txt);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;outline-offset:-1px}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:11.5px;font-weight:600;color:var(--mut);margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em}

/* ---------- LAYOUT ---------- */
#topbar{background:linear-gradient(100deg,var(--azul) 0%,#2b4a86 55%,var(--indigo) 100%);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(31,56,110,.28)}
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--ciano) 0 33%,var(--verde) 33% 66%,var(--roxo) 66% 100%)}
#topbar img.mk{height:30px;background:#fff;border-radius:5px;padding:2px 5px}
#topbar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
#topbar .sp{flex:1}
.btn{border:0;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;background:#fff;color:var(--azul)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.green{background:#15803d;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.dan{background:#fee2e2;color:#991b1b}
.btn:hover{filter:brightness(.95)}

#wrap{display:flex;height:calc(100vh - 45px);overflow:hidden}
#form{width:47%;min-width:420px;overflow-y:auto;padding:14px 16px 80px;background:#fff;border-right:1px solid var(--borda)}
#prevwrap{flex:1;overflow-y:auto;background:#64748b;padding:18px}
@media(max-width:1000px){#wrap{flex-direction:column;height:auto;overflow:visible}#form{width:100%;min-width:0}}

/* ---------- FORM ---------- */
.card{border:1px solid var(--borda);border-radius:9px;margin-bottom:12px;background:#fff;overflow:hidden}
.card>h3{margin:0;padding:10px 13px;background:var(--claro);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--azul);border-bottom:1px solid var(--borda);cursor:pointer;display:flex;align-items:center;gap:8px;position:relative;border-left:4px solid var(--ciano)}
.card>h3 .ar{margin-left:auto;font-size:11px;color:var(--mut)}
.card .body{padding:13px}
.card.col .body{display:none}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:1fr 1fr 1fr 1fr}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px;line-height:1.45}
.chk{display:flex;align-items:flex-start;gap:7px;font-size:13px;font-weight:500;color:var(--txt);text-transform:none;letter-spacing:0;margin:0 0 6px}
.chk input{width:auto;margin-top:2px;flex-shrink:0}
.pill{display:inline-block;background:#e2ecfa;color:var(--azul);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;margin:0 4px 4px 0;border:1px solid #c9dbf3}
.pill.w{background:#fef3c7;color:#92400e}
.tipoGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:620px){.tipoGrid{grid-template-columns:1fr}}
.tipoBtn{border:2px solid var(--borda);border-radius:8px;padding:9px 11px;background:#fff;text-align:left;font-size:12.5px;line-height:1.35}
.tipoBtn b{display:block;font-size:13px;color:var(--azul);margin-bottom:2px}
.tipoBtn small{color:var(--mut);font-size:11px}
.tipoBtn.on{border-color:var(--indigo);background:var(--claro);box-shadow:0 0 0 3px rgba(103,102,204,.22)}

/* itens */
table.it{width:100%;border-collapse:collapse;font-size:12.5px}
table.it th{background:linear-gradient(180deg,#e7effb,#dce8f7);color:var(--azul);font-size:10.5px;text-transform:uppercase;padding:6px 5px;text-align:left;border:1px solid var(--borda);letter-spacing:.03em}
table.it td{border:1px solid var(--borda);padding:4px 5px;vertical-align:middle}
table.it td input,table.it td select{padding:5px 6px;font-size:12.5px;border-radius:4px}
table.it td.num input{text-align:right}
.tot{text-align:right;font-size:13px;padding:4px 0}
.tot b{font-size:17px;color:var(--azul)}
.tot .old{text-decoration:line-through;color:var(--mut);font-size:12px}
.logoprev{max-height:52px;max-width:150px;border:1px solid var(--borda);border-radius:5px;padding:4px;background:#fff;object-fit:contain}
.alerta{background:#fef3c7;border:1px solid #fcd34d;color:#92400e;padding:8px 10px;border-radius:6px;font-size:12px;margin-bottom:9px;line-height:1.45}
.alerta.err{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.alerta.ok{background:#dcfce7;border-color:#86efac;color:#166534}
.mini{font-size:11px;color:var(--mut)}
.rowflex{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* ---------- PREVIEW / PÁGINA A4 ---------- */
.page{width:210mm;height:297mm;overflow:hidden;background:#fff;margin:0 auto 16px;padding:12mm 13mm 13mm;box-shadow:0 3px 14px rgba(0,0,0,.3);position:relative;font-size:10.3pt;line-height:1.45;color:#111;display:flex;flex-direction:column}
.page .content{flex:1}
.phead{display:table;width:100%;border:1.2px solid var(--azul);margin-bottom:8mm;table-layout:fixed;border-radius:2px;overflow:hidden}
.phead>div{display:table-cell;vertical-align:middle;padding:4px 6px;border-right:1px solid var(--azul);font-size:8.2pt;text-align:center}
.phead>div:last-child{border-right:0}
.phead .c1{width:23%}
.phead .c1 img{max-height:44px;max-width:100%;object-fit:contain}
.phead .c2{width:29%;font-weight:700;font-size:8.6pt;line-height:1.25;color:var(--azul)}
.phead .c3{width:34%;font-size:8pt;text-align:left}
.phead .c4{width:14%;font-size:8pt}
.phead .c5{width:15%}
.phead .c5 img{max-height:40px;max-width:100%;object-fit:contain}
.pfoot{margin-top:6mm;border-top:2px solid var(--azul);padding-top:4px;font-size:6.9pt;color:#333;display:flex;justify-content:space-between;gap:6px;line-height:1.3;position:relative}
.pfoot::before{content:"";position:absolute;top:-2px;left:0;width:38%;height:2px;background:linear-gradient(90deg,var(--ciano),var(--verde),var(--roxo))}
.pfoot .lg{flex:0 0 auto;display:flex;align-items:center}
.pfoot .lg img{height:34px;object-fit:contain;padding-right:7px}
.pfoot .u{flex:1}
.pfoot b{display:block;font-size:7.1pt;color:var(--azul)}
.site{text-align:center;font-size:7.4pt;font-weight:700;color:var(--azul);letter-spacing:.04em;margin-top:3px}
h2.sec{font-size:11pt;color:var(--azul);margin:0 0 7px;padding:0 0 4px 9px;border-bottom:2px solid var(--azul);border-left:5px solid var(--ciano);text-transform:uppercase;letter-spacing:.02em}
h3.sub{font-size:9.6pt;margin:9px 0 4px;color:var(--azul);padding-left:7px;border-left:3px solid var(--verde)}
.page p{margin:0 0 6px;text-align:justify}
table.d{width:100%;border-collapse:collapse;font-size:8.9pt;margin-bottom:8px}
table.d th,table.d td{border:1px solid #9fb3cd;padding:4px 6px;vertical-align:top}
table.d th{background:linear-gradient(180deg,#e4edfa,#d3e2f5);font-weight:700;color:var(--azul);text-align:left;border-color:var(--azul)}
table.d td.lbl{background:var(--claro2);font-weight:600;width:31%;color:var(--azul)}
table.d td.r{text-align:right;white-space:nowrap}
table.d td.c{text-align:center}
table.d tr.tot td{background:linear-gradient(180deg,#dfe9f8,#cfe0f4);font-weight:700;color:var(--azul);border-color:var(--azul)}
table.d tr.desc td{color:#0f7a45}
ul.sv{margin:4px 0 6px 16px;padding:0;font-size:9pt;columns:2;column-gap:14px}
ul.sv li{margin-bottom:1px;break-inside:avoid}
.capa{text-align:center;display:flex;flex-direction:column;min-height:255mm}
.capa .logos{display:flex;justify-content:space-between;align-items:center;margin-bottom:6mm;gap:10px;min-height:34mm}
.capa .logos img{max-height:96px;max-width:210px;object-fit:contain}
.capa .mid{flex:1;display:flex;flex-direction:column;justify-content:center}
.capa .band{background:linear-gradient(135deg,#f4f8fd 0%,#e9f1fb 100%);border-top:4px solid var(--ciano);border-bottom:4px solid var(--roxo);padding:11mm 8mm;margin:0 -13mm}
.capa .tag{display:inline-block;background:var(--azul);color:#fff;font-size:8.6pt;letter-spacing:.22em;padding:4px 16px;border-radius:20px;margin-bottom:7mm;font-weight:600}
.capa .info{background:#fff;border:1px solid var(--borda);border-left:5px solid var(--verde);border-radius:4px;padding:7mm 8mm}
.capa h1{font-size:25pt;color:var(--azul);letter-spacing:.06em;margin:0 0 4mm;line-height:1.2;font-weight:700}
.capa .ln{width:62%;height:5px;margin:0 auto 10mm;background:linear-gradient(90deg,var(--ciano) 0 33%,var(--verde) 33% 66%,var(--roxo) 66% 100%);border-radius:3px}
.capa .info{text-align:left;font-size:10.5pt;max-width:150mm;margin:0 auto;line-height:1.85}
.capa .info b{color:var(--azul)}
.assin{margin-top:28mm;display:flex;gap:14mm;justify-content:space-between;text-align:center;font-size:9pt}
.assin div{flex:1;border-top:1px solid #000;padding-top:4px;line-height:1.35}
.val{text-align:center;font-weight:700;margin-top:9mm;font-size:9.5pt;color:var(--azul);background:var(--claro2);border:1px solid var(--borda);border-left:4px solid var(--verde);padding:5px;border-radius:3px}
.obsbox{background:var(--claro2);border:1px solid var(--borda);border-left:4px solid var(--ciano);padding:6px 9px;font-size:8.6pt;margin-bottom:7px;text-align:justify;border-radius:3px}
.clau{margin-bottom:6px;font-size:9.2pt;text-align:justify}
.clau b{color:var(--azul)}

/* ---------- IMPRESSÃO ---------- */
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  #topbar,#form,.noprint{display:none !important}
  #wrap{display:block;height:auto;overflow:visible}
  #prevwrap{padding:0;background:#fff;overflow:visible}
  .page{box-shadow:none;margin:0;width:210mm;min-height:297mm;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>

<div id="topbar">
  <img class="mk" id="mklogo" alt="Grupo Performance">
  <h1>Gerador de Propostas</h1>
  <div class="sp"></div>
  <span id="saveflag" class="mini" style="color:#bfdbfe"></span>
  <button class="btn ghost" onclick="novaProposta()">Nova</button>
  <button class="btn ghost" onclick="abrirHistorico()">Histórico</button>
  <button class="btn green" onclick="baixarPDF()">⬇ Baixar PDF</button>
</div>

<div id="wrap">
  <div id="form"></div>
  <div id="prevwrap"><div id="preview"></div></div>
</div>

const TXT={
 apres:`O Grupo PERFORMANCE OCUPACIONAL atua desde 2011 na área de Medicina do Trabalho e Engenharia de Segurança do Trabalho, destacando-se neste seguimento pela qualidade, treinamentos e eficiência dos nossos profissionais. O Grupo PERFORMANCE OCUPACIONAL avalia cada exigência do Ministério do Trabalho, conforme Lei nº 6.514 de 22/12/77 e Portaria 3.214 de 08/06/78, concernente às Normas Regulamentadoras Ministeriais, que regulamenta a criação de serviços em "Engenharia e Medicina do Trabalho".`,
 apres2:`O Grupo PERFORMANCE OCUPACIONAL disponibiliza uma unidade móvel para atendimento "IN LOCO" em exames periódicos, admissionais e demissionais. Realizamos todos os exames em nossa unidade móvel (Acuidade Visual, Audiometria, Avaliação Clínica, Eletroencefalograma, Eletrocardiograma, Espirometria, Exames Laboratoriais, Raio-X Lombo-sacro, Raio-X Tórax, entre outros). Solicitar demanda mínima para este atendimento.`,
 apres3:`Realizamos também Levantamento Ambiental (Calor, Frio, Luminosidade, Poeiras, Ruídos e Vibrações); para cotação solicitamos o GHE.`,
 P1:`Entrega de Programas Legais possui a previsão de entrega com até 15 dias após o recebimento do check-list preenchido por parte da CONTRATANTE.`,
 P1plus:`Entrega de Programas Legais possui a previsão de entrega com até 15 dias após o recebimento do check-list preenchido por parte da CONTRATANTE.\nExames complementares serão liberados em 03 dias após realização dos exames.\nOs ASO com os exames laboratoriais (Ácido Hipúrico, Ácido Metil Hipúrico, Ala-U, Dosagem de Chumbo e Dosagem de Manganês) serão liberados de 05 a 07 dias após realização dos exames.`,
 P2:`A elaboração e entrega dos PGR e PCMSO possui prazo de 5 (cinco) dias úteis após a aprovação da proposta comercial.\nA elaboração e entrega da APR possui prazo de 5 (cinco) dias úteis após a aprovação da proposta comercial.\nA elaboração e entrega do LTCAT possui prazo de 30 (trinta) dias corridos após a conclusão das avaliações ambientais quantitativas em campo.`,
 P2L:`A elaboração e entrega do LTCAT possui prazo de 30 (trinta) dias corridos após a conclusão das avaliações ambientais quantitativas em campo.`,

/* =======================================================================
   3. CÁLCULOS
   ======================================================================= */
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
function calc(){
  let subU=0,subM=0,descItU=0,descItM=0;
  S.itens.forEach(it=>{
    const bruto=r2((Number(it.qtd)||0)*(Number(it.valor)||0));
    const d=r2(bruto*((Number(it.desc)||0)/100));
    it._bruto=bruto; it._desc=d; it._liq=r2(bruto-d);
    if(it.mensal){subM=r2(subM+bruto);descItM=r2(descItM+d);}
    else {subU=r2(subU+bruto);descItU=r2(descItU+d);}
  });
  const liqU=r2(subU-descItU), liqM=r2(subM-descItM);
  const g=(Number(S.descGeral)||0)/100;
  const dgU=r2(liqU*g), dgM=r2(liqM*g);
  return {subU,subM,descItU,descItM,liqU,liqM,dgU,dgM,
          totU:r2(liqU-dgU), totM:r2(liqM-dgM),
          temU:S.itens.some(i=>!i.mensal), temM:S.itens.some(i=>i.mensal),
          descTotU:r2(descItU+dgU), descTotM:r2(descItM+dgM)};
}
/* regra automática: há medições ambientais? */
function temMedicao(){return S.itens.some(i=>i.med);}
function temDeslocamento(){return S.itens.some(i=>i.desl);}
function agentesMedidos(){
  const m={};
  S.itens.filter(i=>i.med&&i.ag).forEach(i=>{m[i.ag]=(m[i.ag]||0)+(Number(i.qtd)||0);});
  return m;
}
/* totais do GHE por agente (para validação cruzada) */
function totaisGHE(){
  const m={};
  S.ghe.linhas.forEach(l=>{ (l.med||[]).forEach(x=>{ if(x.ag) m[x.ag]=(m[x.ag]||0)+(Number(x.qtd)||0); }); });
  return m;
}
function validar(){
  const v=[];
  if(!S.cli.razao.trim()) v.push(["err","Razão social do contratante é obrigatória."]);
  if(!S.itens.length) v.push(["err","Adicione ao menos um item à proposta."]);
  S.itens.forEach((i,n)=>{ if(!i.desc_txt||!i.desc_txt.trim()) v.push(["err",`Item ${n+1} está sem descrição.`]);
                           if(!(Number(i.valor)>0)) v.push(["warn",`Item ${n+1} ("${(i.desc_txt||"").slice(0,32)}…") está sem valor definido.`]); });
  if(S.cli.cnpj && !cnpjOK(S.cli.cnpj)) v.push(["warn","CNPJ do contratante parece inválido."]);
  const pagOK=S.pag.avista||S.pag.pix||(S.pag.credito&&S.pag.parcelas.length)||(S.pag.fatura&&(S.pag.prazos.length||S.pag.outroData));
  if(!pagOK) v.push(["warn","Nenhuma forma de pagamento foi selecionada."]);
  if(!prazoEntregaTxt().trim()) v.push(["warn","Prazo de entrega não informado."]);
  if(temMedicao()&&!temDeslocamento()) v.push(["warn","Há medições ambientais sem item de Deslocamento — verifique se o custo está previsto."]);
  if(S.pag.pix) v.push(["warn","Pagamento via PIX selecionado: confirme com o Setor Financeiro a retenção de impostos (empresas optantes pelo Simples Nacional possuem regra específica)."]);
  if(S.ghe.ativo&&S.ghe.linhas.length){
    const tg=totaisGHE(), am=agentesMedidos();
    Object.keys(tg).forEach(a=>{ if((am[a]||0)!==tg[a]) v.push(["warn",`GHE: total de "${a}" (${tg[a]}) difere da quantidade cotada no objeto (${am[a]||0}).`]); });
  }
  if(T().foro&&S.prop.foro!==EMISSORES[S.prop.emissor].foro) v.push(["warn",`Foro (${S.prop.foro}) difere do padrão do emissor de NF (${EMISSORES[S.prop.emissor].foro}).`]);
  return v;
}
function cnpjOK(c){
  c=String(c).replace(/\D/g,""); if(c.length!==14||/^(\d)\1+$/.test(c))return false;
  const calc=(x)=>{let s=0,p=x-7;for(let i=0;i<x;i++){s+=c[i]*p--;if(p<2)p=9;}const r=s%11;return r<2?0:11-r;};
  return calc(12)==c[12]&&calc(13)==c[13];
}
/* prazos sugeridos automaticamente a partir dos itens da proposta */
function prazosSugeridos(){
  const cods=S.itens.map(i=>i.cod).filter(Boolean);
  return PRAZOS.filter(p=>p.cods.some(c=>cods.includes(c))).map(p=>p.id);
}
/* lista final de prazos marcados: no modo auto segue os itens; no manual, a seleção */
function prazosAtivos(){
  return S.entrega.modo==="auto" ? prazosSugeridos() : (S.entrega.sel||[]);
}
function prazoEntregaTxt(){
  const m=S.entrega.modo;
  if(m==="livre") return S.entrega.texto||"";
  if(m==="padrao") return TXT[T().prazo]||"";
  const ids=prazosAtivos();
  const linhas=PRAZOS.filter(p=>ids.includes(p.id)).map(p=>p.txt);
  /* no automático, se nenhum serviço da proposta tem prazo específico
     (ex.: contratos só de gestão de eSocial), usa o texto padrão do tipo */
  if(!linhas.length&&m==="auto") linhas.push(TXT[T().prazo]||"");
  if(S.entrega.extra&&S.entrega.extra.trim()) linhas.push(S.entrega.extra.trim());
  return linhas.filter(x=>x&&x.trim()).join("\n");
}
function pagamentoTxt(){
  const L=[];
  if(S.pag.avista) L.push("À Vista");
  if(S.pag.pix) L.push("PIX");
  if(S.pag.credito&&S.pag.parcelas.length){
    const p=[...S.pag.parcelas].sort((a,b)=>a-b);
    L.push("Cartão de Crédito em "+(p.length===1?p[0]+"x":p.join("x, ")+"x"));
  }
  if(S.pag.fatura){
    const pr=[...S.pag.prazos].sort((a,b)=>a-b).map(d=>d+" dias");
    if(S.pag.outroData){
      const [y,m,d]=S.pag.outroData.split("-");
      pr.push("vencimento em "+d+"/"+m+"/"+y);
    }
    if(pr.length) L.push("Faturamento com prazo de "+pr.join(" ou "));
    else L.push("Faturamento");
  }
  return L;
}
function dataExt(iso){
  if(!iso) return "";
  const [y,m,d]=iso.split("-");
  return `${CONTRATADA.cidade}, ${d} de ${MESES[+m-1]} de ${y}.`;

function dataBR(iso){ if(!iso)return""; const[y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function validadeData(){
  if(!S.prop.data) return "";
  const dt=new Date(S.prop.data+"T12:00:00");
  dt.setDate(dt.getDate()+(Number(S.prop.validade)||30));
  return dt.toLocaleDateString("pt-BR");
}

function setPath(path,val){
  const p=path.split("."); let o=S;
  for(let i=0;i<p.length-1;i++) o=o[p[i]];
  if(typeof val==="string"&&/^(descGeral|validade)$/.test(p[p.length-1])) val=val.replace(",",".");
  o[p[p.length-1]]=val;
}
function up(path,val){ setPath(path,val); render(); }

/* ---------- consulta de CNPJ na Receita Federal (BrasilAPI + fallback CNPJá) ---------- */
function cnpjMsg(txt,cor){ const e=document.getElementById("cnpjMsg"); if(e)e.innerHTML=`<div class="mini" style="color:${cor}">${txt}</div>`; }
function tit(s){ // Razão social vem toda em CAIXA ALTA na Receita
  const min=["de","da","do","das","dos","e","em","a","o","na","no"];
  return String(s||"").toLowerCase().split(/\s+/).map((p,i)=>{
    if(i>0&&min.includes(p))return p;
    if(/^(s\/?a|s\.a\.?|ltda|me|epp|eireli|mei)$/i.test(p))return p.toUpperCase();
    return p.charAt(0).toUpperCase()+p.slice(1);
  }).join(" ");
}
function fmtCnpj(c){ c=String(c||"").replace(/\D/g,"");
  return c.length===14?c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5"):c; }
function fmtCep(c){ c=String(c||"").replace(/\D/g,"");
  return c.length===8?c.replace(/^(\d{5})(\d{3})$/,"$1-$2"):c; }
function fmtTel(t){ t=String(t||"").replace(/\D/g,"");
  if(t.length===11)return t.replace(/^(\d{2})(\d{1})(\d{4})(\d{4})$/,"($1) $2 $3-$4");
  if(t.length===10)return t.replace(/^(\d{2})(\d{4})(\d{4})$/,"($1) $2-$3");
  return t; }

async function buscarCNPJ(){
  const num=String(S.cli.cnpj||"").replace(/\D/g,"");
  if(num.length!==14){ cnpjMsg("Digite os 14 dígitos do CNPJ antes de buscar.","var(--erro)"); return; }
  if(!cnpjOK(S.cli.cnpj)){ cnpjMsg("✗ dígito verificador inválido — confira o número.","var(--erro)"); return; }
  const bt=document.getElementById("btCnpj");
  if(bt){bt.disabled=true;bt.textContent="Buscando…";}
  cnpjMsg("Consultando a Receita Federal…","var(--azul)");
  let d=null,fonte="";
  try{
    const r=await fetch("https://brasilapi.com.br/api/cnpj/v1/"+num);
    if(r.ok){ const j=await r.json(); fonte="BrasilAPI";
      d={razao:j.razao_social,fantasia:j.nome_fantasia,end:j.logradouro,num:j.numero,compl:j.complemento,
         bairro:j.bairro,cep:j.cep,cidade:j.municipio,uf:j.uf,tel:j.ddd_telefone_1,email:j.email,
         situacao:j.descricao_situacao_cadastral,simples:j.opcao_pelo_simples,cnae:j.cnae_fiscal_descricao};
    }
  }catch(e){}
  if(!d){
    try{
      const r=await fetch("https://open.cnpja.com/office/"+num);
      if(r.ok){ const j=await r.json(); fonte="CNPJá";
        const a=j.address||{},c=(j.phones||[])[0];
        d={razao:(j.company||{}).name,fantasia:j.alias,end:a.street,num:a.number,compl:a.details,
           bairro:a.district,cep:a.zip,cidade:a.city,uf:a.state,
           tel:c?(c.area+c.number):"",email:((j.emails||[])[0]||{}).address,
           situacao:(j.status||{}).text,simples:((j.company||{}).simples||{}).optant,
           cnae:((j.mainActivity||{}).text)};
      }
    }catch(e){}
  }
  if(bt){bt.disabled=false;bt.textContent="🔎 Buscar";}
  if(!d||!d.razao){
    cnpjMsg("Não foi possível consultar agora (sem internet ou CNPJ não encontrado). Preencha os campos manualmente.","var(--erro)");
    return;
  }
  S.cli.razao=tit(d.razao);
  S.cli.cnpj=fmtCnpj(num);
  if(d.end)    S.cli.end=tit(d.end)+(d.compl?" — "+tit(d.compl):"");
  if(d.num)    S.cli.num=d.num;
  if(d.bairro) S.cli.bairro=tit(d.bairro);
  if(d.cep)    S.cli.cep=fmtCep(d.cep);
  if(d.cidade) S.cli.cidade=tit(d.cidade);
  if(d.uf)     S.cli.uf=String(d.uf).toUpperCase();
  if(d.tel && !S.cli.contatos) S.cli.contatos=fmtTel(d.tel);
  if(d.email && !S.cli.email)  S.cli.email=String(d.email).toLowerCase();
  S.cli._simples = d.simples===true ? true : (d.simples===false ? false : null);
  S.cli._situacao = d.situacao||"";
  render();
  let msg=`✓ Dados carregados via ${fonte}.`, cor="var(--ok)";
  if(d.situacao && !/ATIVA/i.test(d.situacao)){ msg=`⚠ Situação cadastral: <b>${esc(d.situacao)}</b> — confirme antes de emitir. (via ${fonte})`; cor="var(--erro)"; }
  else if(S.cli._simples===true){ msg+=" Empresa <b>optante pelo Simples Nacional</b>."; }
  cnpjMsg(msg+" Confira e ajuste o que for necessário.",cor);
}

                 const c=document.querySelector('input[oninput*="prop.vendedor"]'); if(c)c.focus(); return; }
  const v=VENDEDORES.find(x=>x.n===n);
  if(v){S.prop.vendedor=v.n;S.prop.vemail=v.e;S.prop.vtel=v.t;}
  render();
}
function setEmissor(e){ S.prop.emissor=e; if(S.prop.foroAuto!==false) S.prop.foro=EMISSORES[e].foro; render(); }
function novoItem(c){
  return {cod:c?c.c:"", desc_txt:c?c.d:"", qtd:1, unid:c?c.u:"un", valor:c?c.v:0, desc:0,
          mensal:c&&c.mensal?true:false, med:c&&c.med?1:0, ag:c?c.ag||"":"", desl:c&&c.desl?1:0};
}
function addCat(){ const c=CAT.find(x=>x.c===document.getElementById("selCat").value); if(c){S.itens.push(novoItem(c));render();} }
function addCod(cod){ const c=CAT.find(x=>x.c===cod); if(c){S.itens.push(novoItem(c));render();} }
function addLivre(){ S.itens.push(novoItem(null)); render(); }
function delIt(i){ S.itens.splice(i,1); render(); }
function upIt(i,k,v){
  if(k==="qtd"||k==="valor"||k==="desc") v=String(v).replace(",",".");
  S.itens[i][k]=v;
  /* checkbox "mensal" muda a estrutura das tabelas -> render completo */
  if(k==="mensal") render(); else softRefresh();
}
/* prazos de entrega */
function setModoPrazo(m){
  /* ao sair do automático, herda a seleção sugerida como ponto de partida */
  if(m==="manual"&&(!S.entrega.sel||!S.entrega.sel.length)) S.entrega.sel=prazosSugeridos();
  S.entrega.modo=m; render();
}
function marcarSugeridos(){ S.entrega.sel=prazosSugeridos(); render(); }

/* aplica o mesmo % de desconto em todos os itens da proposta */
function aplicarDescLote(){
  const d=Number(String(S.descLote).replace(",","."))||0;
  if(d<0||d>100){ alert("Informe um percentual entre 0 e 100."); return; }
  if(!S.itens.length){ alert("Adicione itens à proposta primeiro."); return; }
  S.itens.forEach(it=>{ it.desc=d; });
  render();
}
function limparDesc(){
  S.itens.forEach(it=>{ it.desc=0; });
  S.descLote=0; S.descGeral=0;
  render();
}
function aplicarReq(){
  const cf=S.cli.clienteFinal.trim(); if(!cf) return;
  S.itens.forEach(it=>{
    if(it.med||it.desl||it.mensal) return;
    if(it.desc_txt.includes(cf)) return;
    it.desc_txt=it.desc_txt.replace(/\.$/,"")+" e requisitos da "+cf;
  });
  render();
}
function lerLogo(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=e=>{S.cli.logo=e.target.result;render();}; r.readAsDataURL(f);
}
/* GHE */
function addGhe(){ S.ghe.linhas.push({ghe:"",cargo:"",riscos:"",med:[{ag:"",qtd:1,obs:""}]}); render(); }
function delGhe(i){ S.ghe.linhas.splice(i,1); render(); }
function upGhe(i,k,v){ S.ghe.linhas[i][k]=v; softRefresh(); }
function addMed(i){ S.ghe.linhas[i].med.push({ag:"",qtd:1,obs:""}); render(); }
function delMed(i,j){ S.ghe.linhas[i].med.splice(j,1); render(); }
function upMed(i,j,k,v){ S.ghe.linhas[i].med[j][k]=v; softRefresh(); }
function sincGhe(){
  const tg=totaisGHE();
  S.itens.forEach(it=>{ if(it.med&&it.ag&&tg[it.ag]!=null) it.qtd=tg[it.ag]; });
  render();
}
/* psico */
function addCargo(){ S.psico.cargos.push({n:"",q:1}); render(); }
function delCargo(i){ S.psico.cargos.splice(i,1); render(); }
function upCargo(i,k,v){ S.psico.cargos[i][k]=k==="q"?v.replace(",","."):v; softRefresh(); }
function aplicarPsico(m){
  const tot=S.psico.cargos.reduce((a,c)=>a+(Number(c.q)||0),0);
  const am=S.psico.cargos.reduce((a,c)=>a+Math.min(3,Number(c.q)||0),0);
  const alvo=m===1?"PSICO1":"PSICO2", q=m===1?tot:am;
  let it=S.itens.find(x=>x.cod===alvo);
  if(!it){ const c=CAT.find(x=>x.c===alvo); it=novoItem(c); S.itens.push(it); }
  it.qtd=q; render();
}
/* persistência */
function salvarLast(){ try{ localStorage.setItem(LS_LAST,JSON.stringify(S)); flag("salvo ✓"); }catch(e){} }
let ft; function flag(t){ const e=document.getElementById("saveflag"); if(!e)return; e.textContent=t; clearTimeout(ft); ft=setTimeout(()=>e.textContent="",1800); }
function carregarLast(){
  try{ const j=localStorage.getItem(LS_LAST); if(j){ S=Object.assign(estadoInicial(),JSON.parse(j)); return true; } }catch(e){}
  return false;
}
function novaProposta(){
  if(!confirm("Iniciar uma nova proposta em branco? O preenchimento atual será perdido (salve no histórico antes, se quiser).")) return;
  S=estadoInicial(); setTipo(S.tipo); render();
}
function salvarHist(){
  const h=JSON.parse(localStorage.getItem(LS_HIST)||"[]");
  h.unshift({id:Date.now(),nome:(S.cli.razao||"sem cliente")+" — "+(S.prop.num||S.tipo),data:new Date().toLocaleString("pt-BR"),s:JSON.parse(JSON.stringify(S))});
  localStorage.setItem(LS_HIST,JSON.stringify(h.slice(0,40)));
  alert("Proposta salva no histórico.");
}
function abrirHistorico(){
  const h=JSON.parse(localStorage.getItem(LS_HIST)||"[]");
  if(!h.length){ alert("Nenhuma proposta salva ainda."); return; }
  const op=h.map((x,i)=>`${i+1}) ${x.nome} — ${x.data}`).join("\n");
  const r=prompt("Histórico de propostas:\n\n"+op+"\n\nDigite o número para carregar (ou 0 para limpar tudo):");
  if(r===null) return;
  const n=parseInt(r,10);
  if(n===0){ if(confirm("Apagar todo o histórico?")) localStorage.removeItem(LS_HIST); return; }
  if(h[n-1]){ S=Object.assign(estadoInicial(),h[n-1].s); render(); }
}
function baixarPDF(){
  const V=validar().filter(v=>v[0]==="err");
  if(V.length && !confirm("Há pendências:\n\n"+V.map(v=>"• "+v[1]).join("\n")+"\n\nGerar o PDF mesmo assim?")) return;
  salvarLast();
  const nome=`Proposta_${(S.prop.num||"S-N").replace(/[^\w-]/g,"")}_${(S.cli.razao||"cliente").replace(/[^\w]/g,"_").slice(0,32)}`;
  const t0=document.title; document.title=nome;
  window.print();
  setTimeout(()=>document.title=t0,900);
}

    const e1=EMISSORES.filial,e2=EMISSORES.matriz;
    fat+=`<p>A emissão de NF ocorrerá por nossa filial de ${e1.cid}, conforme identificação abaixo:</p>
      <table class="d"><tr><td class="lbl">Razão Social</td><td>${esc(e1.razao)}</td></tr>
      <tr><td class="lbl">Nome Fantasia</td><td>${esc(e1.fant)}</td></tr><tr><td class="lbl">CNPJ</td><td>${e1.cnpj}</td></tr></table>
      <p>A emissão de NF de exames médicos ocupacionais ocorrerá por nossa matriz de ${e2.cid}, conforme identificação abaixo:</p>
      <table class="d"><tr><td class="lbl">Razão Social</td><td>${esc(e2.razao)}</td></tr>
      <tr><td class="lbl">Nome Fantasia</td><td>${esc(e2.fant)}</td></tr><tr><td class="lbl">CNPJ</td><td>${e2.cnpj}</td></tr></table>`;
  }
  const pesoFat=4+Math.ceil(TXT[t.fat].length/95)+(usaNf?16:0);
  /* a área útil comporta ~44 linhas; se estourar, o Faturamento vai para outra página */
  if(peso+pesoFat>44){ P.push(pg(f)); P.push(pg(fat)); }
  else P.push(pg(f+fat));

  let z="";
  if(usaVig) z+=`<h2 class="sec">${N("vig")}. DO PRAZO DE VIGÊNCIA E DA RESCISÃO</h2>${nl2p(TXT.vig)}`;
  z+=`<h2 class="sec" style="margin-top:9px">${N("foro")}. DO FORO</h2>
    <p>As partes elegem o Foro da Comarca de ${esc(S.prop.foro)} para dirimir quaisquer dúvidas oriundas do presente contrato e de eventuais aditamentos.</p>`;
  if(S.obs) z+=`<div class="obsbox">${esc(S.obs)}</div>`;
  z+=`<p style="margin-top:6px">Ficamos à disposição para esclarecer possíveis dúvidas ou para eventuais alterações da proposta, com vista a atender o mais conveniente possível às necessidades da ${esc(cli)}.</p>
    <p style="margin-top:8mm">${esc(dataExt(S.prop.data))}</p>
    <div class="assin">
      <div>${esc(CONTRATADA.razao)}<br>${esc(S.prop.vendedor)}<br>${esc(S.prop.vemail)}<br>${esc(S.prop.vtel)}</div>
      <div>${esc(cli)}<br>${esc(S.prop.aprovador||"Responsável pela empresa")}</div>
    </div>
    <div class="val">Validade da proposta ${S.prop.validade} (${numExt(S.prop.validade)}) dias${validadeData()?" — até "+validadeData():""}.</div>`;
  P.push(pg(z));

  _tp=P.length;
  /* segunda passada: paginação correta */
  _np=0;
  document.getElementById("preview").innerHTML=P.join("").replace(/PÁGINA<br><b>\d+ \/ \d+<\/b>/g,()=>`PÁGINA<br><b>${++_np+1} / ${_tp}</b>`);
}
function numExt(n){
  const m={15:"quinze",20:"vinte",30:"trinta",45:"quarenta e cinco",60:"sessenta",90:"noventa"};
  return m[n]||n;
}

/* =======================================================================
   7. BOOT
   ======================================================================= */
/* --- preservação de foco: identifica o campo pelo seu handler + posição --- */
function keyOf(el){
  return (el.getAttribute("oninput")||el.getAttribute("onchange")||"")+"|"+el.tagName+"|"+(el.type||"");
}
function campos(){ return [...document.getElementById("form").querySelectorAll("input,textarea,select")]; }
function snapFocus(){
  const el=document.activeElement, form=document.getElementById("form");
  const st={scroll:form?form.scrollTop:0};
  if(!el||!form||!form.contains(el)||!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return st;
  const k=keyOf(el);
  st.key=k;
  st.idx=campos().filter(x=>keyOf(x)===k).indexOf(el);
  try{ st.s=el.selectionStart; st.e=el.selectionEnd; }catch(_){}
  return st;
}
function restoreFocus(st){
  const form=document.getElementById("form"); if(!form) return;
  if(st&&st.scroll!=null) form.scrollTop=st.scroll;
  if(!st||!st.key) return;
  const el=campos().filter(x=>keyOf(x)===st.key)[st.idx];
  if(!el) return;
  el.focus({preventScroll:true});
  if(st.s!=null){ try{ el.setSelectionRange(st.s,st.e); }catch(_){} }
}

/* atualiza só o preview + salva; NÃO toca no formulário (digitação fluida) */
let tsoft;
function softRefresh(){
  clearTimeout(tprev); tprev=setTimeout(renderPreview,160);
  clearTimeout(tsave); tsave=setTimeout(salvarLast,700);
  clearTimeout(tsoft); tsoft=setTimeout(atualizaTotais,180);
}
/* reflete totais/validações/derivados no formulário SEM recriar os campos
   (assim o cursor e o foco nunca são perdidos durante a digitação) */
function atualizaTotais(){
  const C=calc();
  const set=(id,html)=>{const e=document.getElementById(id); if(e&&e.innerHTML!==html) e.innerHTML=html;};
  set("boxTot",htmlTotais(C));
  set("boxVal",htmlValida());
  document.querySelectorAll("[data-liq]").forEach(td=>{
    const it=S.itens[+td.getAttribute("data-liq")];
    if(it) td.innerHTML=money(it._liq)+(it._desc>0?`<div class="mini" style="text-decoration:line-through">${money(it._bruto)}</div>`:"");
  });
  /* totais do GHE */
  const g=document.getElementById("boxGhe");
  if(g){ const tg=totaisGHE();
    g.innerHTML=Object.keys(tg).length?`Totais: ${Object.entries(tg).map(([a,q])=>`<span class="pill">${esc(a)}: ${q}</span>`).join("")}
      <button class="btn sm" style="background:var(--claro);margin-left:4px" onclick="sincGhe()">Sincronizar quantidades com o Objeto</button>`:"";
  }
  /* contagem psicossocial */
  const ps=document.getElementById("boxPsico");
  if(ps){
    const tot=S.psico.cargos.reduce((a,c)=>a+(Number(c.q)||0),0);
    const am=S.psico.cargos.reduce((a,c)=>a+Math.min(3,Number(c.q)||0),0);
    ps.innerHTML=`<b>Método 1 (Completo):</b> ${tot} colaboradores<br>
      <b>Método 2 (Amostragem, mín. 3 por cargo):</b> ${am} colaboradores
      <div class="rowflex" style="margin-top:6px">
        <button class="btn sm" onclick="aplicarPsico(1)">Aplicar M1 (${tot})</button>
        <button class="btn sm" onclick="aplicarPsico(2)">Aplicar M2 (${am})</button></div>`;
  }
}

let tsave,tprev;
function render(){
  const st=snapFocus();
  renderForm();
  restoreFocus(st);
  clearTimeout(tprev); tprev=setTimeout(renderPreview,160);   // preview sem travar a digitação
  clearTimeout(tsave); tsave=setTimeout(salvarLast,700);
}
document.getElementById("mklogo").src=LOGO_POP;
if(!carregarLast()){ S=estadoInicial(); setTipo("E"); }
renderForm(); renderPreview();
