<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="lente" clipPathUnits="userSpaceOnUse">
      <circle cx="44" cy="38" r="22"/>
    </clipPath>
  </defs>

  <!-- Círculo roxo (direita) -->
  <circle cx="44" cy="38" r="22" fill="#9A66CB" stroke="#FFFFFF" stroke-width="1.8" paint-order="stroke fill"/>

  <!-- Círculo ciano (esquerda, sobrepõe o roxo) -->
  <circle cx="20" cy="38" r="22" fill="#04CCFF" stroke="#FFFFFF" stroke-width="1.8" paint-order="stroke fill"/>

  <!-- Lente índigo: sobreposição ciano + roxo -->
  <g clip-path="url(#lente)">
    <circle cx="20" cy="38" r="22" fill="#6766CC" stroke="#FFFFFF" stroke-width="1.8" paint-order="stroke fill"/>
  </g>

  <!-- Pétala/folha verde (topo) -->
  <path d="M14,26
           C16,8 24,2 32,2
           C40,2 48,8 50,26
           Q41,35 32,36
           Q23,35 14,26 Z"
        fill="#7FCC0E" stroke="#FFFFFF" stroke-width="1.8"
        stroke-linejoin="round" paint-order="stroke fill"/>
</svg>
